<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Video to Text Converter</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#e11d48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Video to Text">
<style>
  :root{--bg:#fafafa;--card:#fff;--text:#1a1a1a;--muted:#6b7280;--line:#e5e7eb;--accent:#e11d48;--accent-d:#be123c}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--text:#eceef2;--muted:#9aa3b2;--line:#2a2f3a}}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  main{max-width:820px;margin:0 auto;padding:32px 16px 64px}
  h1{font-size:1.9rem;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input,select,button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 12px}
  #url{flex:1 1 280px}
  button{cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{background:var(--accent-d)}
  button:disabled{opacity:.6;cursor:wait}
  .opts{margin-top:10px;color:var(--muted);font-size:.9rem;align-items:center}
  .opts select{padding:6px 8px}
  #status{margin:16px 0;color:var(--muted)}
  #status.err{color:var(--accent)}
  #result{display:none;margin-top:16px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .bar .spacer{flex:1}
  .meta{color:var(--muted);font-size:.85rem;margin-bottom:8px}
  #search{flex:1 1 160px}
  #lines{max-height:60vh;overflow:auto;border-top:1px solid var(--line)}
  .line{display:flex;gap:12px;padding:6px 2px;border-bottom:1px solid var(--line)}
  .line a{color:var(--accent);font-variant-numeric:tabular-nums;text-decoration:none;flex:none;min-width:56px}
  .line a:hover{text-decoration:underline}
  .hide-ts .line a{display:none}
  mark{background:#fde68a;color:#000;border-radius:3px}
  footer{margin-top:28px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>YouTube Video to Text Converter</h1>
  <p class="sub">Paste a YouTube URL and get the whole video as readable text, with timestamps, in seconds.</p>

  <form class="card" id="form">
    <div class="row">
      <input id="url" placeholder="https://www.youtube.com/watch?v=… or youtu.be/… or video ID" autocomplete="off" required>
      <button class="primary" id="go" type="submit">Extract</button>
    </div>
    <div class="row opts">
      <label>Caption language
        <select id="lang">
          <option value="">Auto (English first)</option>
          <option value="en">English</option><option value="hi">Hindi</option>
          <option value="es">Spanish</option><option value="fr">French</option>
          <option value="de">German</option><option value="pt">Portuguese</option>
          <option value="ja">Japanese</option><option value="ko">Korean</option>
          <option value="ar">Arabic</option><option value="ru">Russian</option>
        </select>
      </label>
      <label>Translate to
        <select id="translate">
          <option value="">No translation</option>
          <option value="en">English</option><option value="hi">Hindi</option>
          <option value="es">Spanish</option><option value="fr">French</option>
          <option value="de">German</option><option value="pt">Portuguese</option>
          <option value="ja">Japanese</option><option value="ko">Korean</option>
          <option value="ar">Arabic</option><option value="ru">Russian</option>
          <option value="zh-Hans">Chinese (Simplified)</option><option value="bn">Bengali</option>
          <option value="ta">Tamil</option><option value="te">Telugu</option>
        </select>
      </label>
    </div>
  </form>

  <div id="status"></div>

  <section class="card" id="result">
    <div class="meta" id="meta"></div>
    <div class="bar">
      <input id="search" placeholder="Search in transcript…">
      <label><input type="checkbox" id="tsToggle" checked> Timestamps</label>
      <span class="spacer"></span>
      <button id="copy">Copy</button>
      <button data-dl="txt">TXT</button>
      <button data-dl="srt">SRT</button>
      <button data-dl="vtt">VTT</button>
      <button data-dl="json">JSON</button>
    </div>
    <div id="lines"></div>
  </section>

  <footer>Captions are read directly from YouTube. If a video has none, the audio is transcribed with AI speech recognition.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
let data = null;

const pad = (n, w = 2) => String(n).padStart(w, "0");
function hms(sec, sep = ".", ms = false) {
  const t = Math.floor(sec), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  const base = h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  return base;
}
function stamp(sec, sep) { // SRT/VTT style
  const t = Math.floor(sec), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  const ms = Math.round((sec - t) * 1000);
  return `${pad(h)}:${pad(m)}:${pad(s)}${sep}${pad(ms, 3)}`;
}
function setStatus(msg, err = false) { $("status").textContent = msg; $("status").className = err ? "err" : ""; }
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function render() {
  const q = $("search").value.trim().toLowerCase();
  const re = q ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi") : null;
  $("lines").className = $("tsToggle").checked ? "" : "hide-ts";
  $("lines").innerHTML = data.segments
    .filter(s => !q || s.text.toLowerCase().includes(q))
    .map(s => {
      const text = esc(s.text.replace(/\n/g, " "));
      const shown = re ? text.replace(re, m => `<mark>${m}</mark>`) : text;
      return `<div class="line"><a target="_blank" rel="noopener" href="https://youtu.be/${data.video_id}?t=${Math.floor(s.start)}">${hms(s.start)}</a><span>${shown}</span></div>`;
    }).join("");
}

function build(fmt) {
  const seg = data.segments, clean = s => s.text.replace(/\n/g, " ");
  if (fmt === "json") return JSON.stringify(seg, null, 2);
  if (fmt === "srt") return seg.map((s, i) =>
    `${i + 1}\n${stamp(s.start, ",")} --> ${stamp(s.start + s.duration, ",")}\n${clean(s)}\n`).join("\n");
  if (fmt === "vtt") return "WEBVTT\n\n" + seg.map(s =>
    `${stamp(s.start, ".")} --> ${stamp(s.start + s.duration, ".")}\n${clean(s)}\n`).join("\n");
  const ts = $("tsToggle").checked;
  return seg.map(s => (ts ? `[${hms(s.start)}] ` : "") + clean(s)).join("\n");
}

function download(fmt) {
  const type = fmt === "json" ? "application/json" : "text/plain";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([build(fmt)], { type: type + ";charset=utf-8" }));
  a.download = `${data.video_id}.${fmt}`;
  a.click();
  URL.revokeObjectURL(a.href);
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("go").disabled = true;
  $("result").style.display = "none";
  setStatus("Fetching transcript… (videos without captions can take a minute while audio is transcribed)");
  try {
    const r = await fetch("/api/transcript", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("url").value, lang: $("lang").value, translate: $("translate").value }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Something went wrong.");
    data = j;
    const words = j.segments.reduce((n, s) => n + s.text.split(/\s+/).length, 0);
    $("meta").textContent = `${j.segments.length} lines · ~${words.toLocaleString()} words · language: ${j.language} · source: ${j.source === "ai" ? "AI speech recognition" : "YouTube captions"}`;
    $("search").value = "";
    render();
    $("result").style.display = "block";
    setStatus("");
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $("go").disabled = false;
  }
});

// Offline shell + installable app
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

// Paste button: one tap fills the box from the clipboard
$("url").addEventListener("focus", async () => {
  if ($("url").value) return;
  try {
    const t = await navigator.clipboard.readText();
    if (/youtu\.?be/.test(t)) $("url").value = t.trim();
  } catch (e) {}
});

// "Share" from the YouTube app straight into this app
const p = new URLSearchParams(location.search);
const shared = p.get("url") || p.get("text") || "";
const m = shared.match(/https?:\/\/\S+/);
if (m) {
  $("url").value = m[0];
  history.replaceState(null, "", "/");
  $("form").requestSubmit();
}

$("search").addEventListener("input", () => data && render());
$("tsToggle").addEventListener("change", () => data && render());
$("copy").addEventListener("click", async () => {
  await navigator.clipboard.writeText(build("txt"));
  $("copy").textContent = "Copied!";
  setTimeout(() => $("copy").textContent = "Copy", 1200);
});
document.querySelectorAll("[data-dl]").forEach(b => b.addEventListener("click", () => data && download(b.dataset.dl)));
</script>
</body>
</html>
